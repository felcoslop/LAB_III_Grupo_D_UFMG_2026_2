# Integração contínua do firmware.
# Todo pull request (para a main ou empilhado sobre outro pull request) e todo push na main
# passam por quatro testes: a compilação do firmware para o ESP32 Dev Module (na linha 2.x e na
# linha 3.x do core da Espressif, com 5 e com 7 sensores de oponente, com os motores desligados
# como na bancada e também ligados), os testes da cinemática, da máquina de estados, da partida
# automática, da localização no dojô e do PWM dos motores rodando no computador, uma bateria de lutas
# simuladas com o firmware de verdade (nenhuma queda própria e nenhuma perseguição longa de
# objeto fora do dojô) e a conferência de que o painel/painel_sumo.html, a página do combate
# (site/combate.html) e a da montagem (site/montagem.html) foram gerados a partir do código
# atual e de que a página do simulador (site) usa as mesmas constantes do config.h. Mais um
# job roda o simulador de combate com a física do MuJoCo (empurrão frente a frente e uma bateria).
name: Compilação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  URL_ESP32: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  firmware:
    name: Firmware (core ${{ matrix.core }}, ${{ matrix.sensores }} sensores, motores ${{ matrix.motores }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.3.0"]
        sensores: [5, 7]
        motores: [0]
        # o código dos motores (ponte H e cinemática) também é compilado, nas duas linhas do core
        include:
          - { core: "2.0.17", sensores: 5, motores: 1 }
          - { core: "3.3.0", sensores: 7, motores: 1 }
    steps:
      # o sketch fica em firmware/sumo_esp32: a pasta já tem o mesmo nome do .ino, como a Arduino CLI exige
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache do core e das bibliotecas
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ matrix.core }}-vl53l0x-1.3.1

      - name: Instalação do core ESP32 e da biblioteca VL53L0X
        run: |
          arduino-cli core update-index --additional-urls "$URL_ESP32"
          arduino-cli core install "esp32:esp32@${{ matrix.core }}" --additional-urls "$URL_ESP32"
          arduino-cli lib install "VL53L0X@1.3.1"

      - name: Compilação
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default \
            --build-property "compiler.cpp.extra_flags=-DQTD_TOF=${{ matrix.sensores }} -DUSAR_MOTORES=${{ matrix.motores }}" \
            --additional-urls "$URL_ESP32" firmware/sumo_esp32 2>&1 | tee compilacao.log
          exit ${PIPESTATUS[0]}

      - name: Uso de memória
        if: always()
        run: |
          {
            echo "### Core ESP32 ${{ matrix.core }}, ${{ matrix.sensores }} sensores, motores ${{ matrix.motores }}"
            echo '```'
            grep -E "Sketch uses|Global variables" compilacao.log || echo "sem resumo de memória"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  testes:
    name: Testes no computador (cinemática, estados, localização e motores)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FW: firmware/sumo_esp32
      INC: -I teste/unidade/stub -I firmware/sumo_esp32
    steps:
      - uses: actions/checkout@v4
      # os módulos do firmware compilam com o g++ do computador e um Arduino.h de mentira
      - name: Cinemática das rodas
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror $INC teste/unidade/teste_cinematica.cpp $FW/cinematica.cpp -o teste_cinematica
          ./teste_cinematica
      - name: Máquina de estados com a cinemática, a localização e a chave DIP
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror $INC teste/unidade/teste_estados.cpp \
            $FW/estados.cpp $FW/cinematica.cpp $FW/arena.cpp $FW/chave.cpp $FW/antitrava.cpp -o teste_estados
          ./teste_estados
      # robô sem botão de início: parte sozinho só com os sensores prontos, uma vez por ligada
      - name: Partida automática (AUTO_START 1)
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror $INC -DAUTO_START=1 teste/unidade/teste_autostart.cpp \
            $FW/estados.cpp $FW/cinematica.cpp $FW/arena.cpp $FW/chave.cpp $FW/antitrava.cpp -o teste_autostart
          ./teste_autostart
      # filtro de partículas do dojô nas duas geometrias dos sensores de borda
      - name: Localização no dojô (bancada e robô montado)
        run: |
          for g in 1 0; do
            g++ -std=c++11 -O2 -Wall -Wextra -Werror $INC -DGEOMETRIA_BANCADA=$g teste/unidade/teste_arena.cpp $FW/arena.cpp -o teste_arena
            ./teste_arena
          done
      # o PWM dos motores é conferido com a API do LEDC das duas linhas do core
      - name: PWM dos motores (core 2.x e 3.x)
        run: |
          for v in 2 3; do
            g++ -std=c++11 -Wall -Wextra -Werror $INC -DUSAR_MOTORES=1 -DESP_ARDUINO_VERSION_MAJOR=$v teste/unidade/teste_motores.cpp $FW/motores.cpp -o teste_motores
            ./teste_motores
          done

  lutas:
    name: Lutas simuladas (software in the loop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Simulador com o firmware
        run: bash teste/sim/compila.sh
      # as 3 estratégias contra os 6 oponentes, claro e escuro, com pessoas em volta do dojô:
      # falha com qualquer queda própria ou com mais de 3 s mirando algo fora do dojô numa luta
      - name: Bateria com pessoas em volta do dojô
        run: |
          python teste/sim/roda_lutas.py teste/sim/luta --sementes 8 --dips 1,2,4 --fora --perfil-pela-cor \
            --exige --fantasma-max 3 --csv lutas.csv | tee lutas.txt
      - name: Resumo da bateria
        if: always()
        run: |
          { echo "### Lutas simuladas"; echo '```'; cat lutas.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lutas-simuladas
          path: lutas.csv

  combate:
    name: Combate com dois firmwares (software in the loop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Simulador de combate
        run: bash teste/combate/compila.sh
      # as 3 estratégias contra o adversário de 1000, 600 e 319 rpm, preto e branco, com o
      # mesmo firmware nos dois robôs: falha se o robô do Grupo D sair do dojô sozinho
      - name: Bateria de combate
        run: |
          python teste/combate/bateria.py teste/combate/combate --sementes 4 --exige-quedas-proprias 0 \
            --csv combate.csv | tee combate.txt
      - name: Resumo da bateria
        if: always()
        run: |
          { echo "### Combate com dois firmwares"; echo '```'; cat combate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combate-simulado
          path: combate.csv
      # o mesmo código compilado para WebAssembly, como a página 3D usa; a página versionada precisa
      # ser igual à gerada com este WebAssembly e a bateria de doc/combate/bateria.json
      - name: WebAssembly e página 3D do combate
        run: |
          pip install ziglang==0.14.0
          ZIG="python -m ziglang" bash teste/combate/compila.sh wasm
          python ferramentas/gera_combate.py --wasm teste/combate/combate.wasm
          git diff --exit-code -- site/combate.html || {
            echo "::error::site/combate.html desatualizado: compile o wasm, rode python ferramentas/gera_combate.py --wasm teste/combate/combate.wasm e faça o commit"
            exit 1
          }

  combate-mujoco:
    name: Combate com a física do MuJoCo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MuJoCo
        run: pip install mujoco==3.16.0
      - name: Simulador de combate e empurrão com o MuJoCo
        run: |
          MUJOCO=1 bash teste/combate/compila.sh nativo teste/combate/combate_mj
          MUJOCO=1 bash teste/combate/compila.sh empurrao teste/combate/empurrao
      # o empurrão frente a frente nas duas físicas: o MuJoCo precisa decidir quase todos em 3 s, dois
      # robôs iguais precisam ficar perto de 50 a 50 e o robô com o nariz levantado precisa perder
      - name: Empurrão frente a frente nas duas físicas
        run: |
          python teste/combate/compara_fisicas.py teste/combate/empurrao --lutas 40 --exige | tee empurrao.txt
      # as 3 estratégias contra o adversário de 1000, 600 e 319 rpm, com o firmware nos dois robôs
      - name: Bateria de combate com o MuJoCo
        run: |
          python teste/combate/bateria.py teste/combate/combate_mj --sementes 3 --extra "-F mujoco" \
            --exige-quedas-proprias 0 --csv combate_mj.csv | tee combate_mj.txt
      - name: Resumo
        if: always()
        run: |
          { echo "### Empurrão nas duas físicas"; echo '```'; cat empurrao.txt; echo '```'; \
            echo "### Combate com o MuJoCo"; echo '```'; cat combate_mj.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combate-mujoco
          path: combate_mj.csv

  painel:
    name: Painel e página do simulador
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Geração do painel e comparação com o arquivo versionado
        run: |
          python ferramentas/gera_painel.py
          git diff --exit-code -- painel/painel_sumo.html || {
            echo "::error::painel/painel_sumo.html desatualizado: rode python ferramentas/gera_painel.py e faça o commit"
            exit 1
          }
      - name: Página do simulador com as constantes do config.h
        run: python ferramentas/confere_site.py
      # montagem 3D: posições dos sensores e GPIOs do config.h, peças do montagem.json
      - name: Página da montagem e comparação com o arquivo versionado
        run: |
          python ferramentas/gera_montagem.py
          git diff --exit-code -- site/montagem.html || {
            echo "::error::site/montagem.html desatualizado: rode python ferramentas/gera_montagem.py e faça o commit"
            exit 1
          }
