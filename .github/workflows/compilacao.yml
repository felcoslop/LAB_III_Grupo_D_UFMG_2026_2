# Integração contínua do firmware.
# Todo pull request (para a main ou empilhado sobre outro pull request) e todo push na main
# passam por três testes: a compilação do firmware para o ESP32 Dev Module (na linha 2.x e na
# linha 3.x do core da Espressif, com 5 e com 7 sensores de oponente, com os motores desligados
# como na bancada e também ligados), os testes da cinemática, da máquina de estados e do PWM
# dos motores rodando no computador, e a conferência de que o painel_sumo.html foi gerado a
# partir do doc/painel_src.html atual e de que a página do simulador (doc/site) usa as mesmas
# constantes do config.h.
name: Compilação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  URL_ESP32: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  firmware:
    name: Firmware (core ${{ matrix.core }}, ${{ matrix.sensores }} sensores, motores ${{ matrix.motores }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        core: ["2.0.17", "3.3.0"]
        sensores: [5, 7]
        motores: [0]
        # o código dos motores (ponte H e cinemática) também é compilado, nas duas linhas do core
        include:
          - { core: "2.0.17", sensores: 5, motores: 1 }
          - { core: "3.3.0", sensores: 7, motores: 1 }
    steps:
      # a pasta precisa ter o mesmo nome do .ino para a Arduino CLI aceitar o sketch
      - uses: actions/checkout@v4
        with:
          path: sumo_esp32

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache do core e das bibliotecas
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-${{ matrix.core }}-vl53l0x-1.3.1

      - name: Instalação do core ESP32 e da biblioteca VL53L0X
        run: |
          arduino-cli core update-index --additional-urls "$URL_ESP32"
          arduino-cli core install "esp32:esp32@${{ matrix.core }}" --additional-urls "$URL_ESP32"
          arduino-cli lib install "VL53L0X@1.3.1"

      - name: Compilação
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default \
            --build-property "compiler.cpp.extra_flags=-DQTD_TOF=${{ matrix.sensores }} -DUSAR_MOTORES=${{ matrix.motores }}" \
            --additional-urls "$URL_ESP32" sumo_esp32 2>&1 | tee compilacao.log
          exit ${PIPESTATUS[0]}

      - name: Uso de memória
        if: always()
        run: |
          {
            echo "### Core ESP32 ${{ matrix.core }}, ${{ matrix.sensores }} sensores, motores ${{ matrix.motores }}"
            echo '```'
            grep -E "Sketch uses|Global variables" compilacao.log || echo "sem resumo de memória"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  testes:
    name: Testes no computador (cinemática, estados e motores)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # os módulos do firmware compilam com o g++ do computador e um Arduino.h de mentira
      - name: Cinemática das rodas
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I teste/stub -I . teste/teste_cinematica.cpp cinematica.cpp -o teste_cinematica
          ./teste_cinematica
      - name: Máquina de estados com a cinemática
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I teste/stub -I . teste/teste_estados.cpp estados.cpp cinematica.cpp -o teste_estados
          ./teste_estados
      # o PWM dos motores é conferido com a API do LEDC das duas linhas do core
      - name: PWM dos motores (core 2.x e 3.x)
        run: |
          for v in 2 3; do
            g++ -std=c++11 -Wall -Wextra -Werror -I teste/stub -I . -DUSAR_MOTORES=1 -DESP_ARDUINO_VERSION_MAJOR=$v teste/teste_motores.cpp motores.cpp -o teste_motores
            ./teste_motores
          done

  painel:
    name: Painel e página do simulador
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Geração do painel e comparação com o arquivo versionado
        run: |
          python doc/gera_painel.py
          git diff --exit-code -- painel_sumo.html || {
            echo "::error::painel_sumo.html desatualizado: rode python doc/gera_painel.py e faça o commit"
            exit 1
          }
      - name: Página do simulador com as constantes do config.h
        run: python doc/confere_site.py
